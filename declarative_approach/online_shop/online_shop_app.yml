apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-shop-app
  namespace: argocd              # <- Keep as 'argocd' (where Argo CD lives)
spec:
  project: default
  source:
    repoURL: https://github.com/Rakesh-Patra/argocd-demos.git
    targetRevision: main
    path: declarative_approach/online_shop
  destination:
    server: https://172.31.41.61:33893
    namespace: online-shop       # <- Where your app's Pods/Services deploy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true     # <- Auto-creates 'online-shop' if missing
    
